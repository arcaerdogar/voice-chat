# Kullanım: aynı klasörde .env dosyası olmalı (bkz. .env.example)
services:
  riftvoice:
    build: .
    image: riftvoice:latest
    container_name: riftvoice
    restart: always
    environment:
      - PORT=3000
      - TURN_URLS=turn:212.64.215.98:3478?transport=udp,turn:212.64.215.98:3478?transport=tcp
      - TURN_SECRET=${TURN_SECRET:?.env dosyasinda TURN_SECRET ayarlanmali}
      # İsteğe bağlı: şarkı adıyla arama ve çalınamayan videolara otomatik alternatif
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - MUSIC_REGION=${MUSIC_REGION:-TR}
      - MUSIC_STREAM=${MUSIC_STREAM:-auto}
      # Yönetici paneli (/admin): ikisi de .env'de tanımlıysa açılır; şifre en az 10 karakter
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # YouTube sunucuyu bot sanarsa: tarayıcıdan alınan çerezleri data/youtube-cookies.txt olarak koyun
      - YTDLP_COOKIES=/data/youtube-cookies.txt
    volumes:
      - ./data:/data:ro
    # Sadece sunucunun içinden erişilir; dışarıya nginx açar.
    ports:
      - "127.0.0.1:4010:3000"

  coturn:
    image: coturn/coturn:4.6
    container_name: riftvoice-turn
    restart: always
    # TURN çok sayıda UDP portu kullandığı için host ağında çalışır
    # (portlar: 3478 udp/tcp, 49160-49260 udp).
    network_mode: host
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?.env dosyasinda TURN_SECRET ayarlanmali}
