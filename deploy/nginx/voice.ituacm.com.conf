# /etc/nginx/conf.d/voice.ituacm.com.conf
#
# RiftVoice reverse proxy.
# Frontend (statik dosyalar) ve backend (WebSocket sinyal sunucusu) AYNI Node
# sürecinden, aynı porttan sunulur. Bu yüzden:
#   - Tek upstream yeterli (docker-compose ile 127.0.0.1:4010)
#   - Frontend ve backend aynı origin'de olduğundan CORS ayarı GEREKMEZ.
# Alan adını kendi alan adınla değiştir (server_name + sertifika yolları).

# HTTP -> HTTPS yönlendirmesi
server {
  listen 80;
  listen [::]:80;
  server_name voice.ituacm.com;
  return 301 https://$host$request_uri;
}

# HTTPS sunucu
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name voice.ituacm.com;

  # Sertifikalar (Cloudflare Origin ya da LE yolların)
  ssl_certificate     /etc/ssl/cloudflare/ituacm.com.origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare/ituacm.com.origin.key;

  # Mikrofon izni için tarayıcılar HTTPS ister; HSTS ile hep HTTPS kalsın.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # ---- Backend: WebSocket sinyal sunucusu ----
  location = /ws {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    # İstemci 5 sn'de bir ping atar; uzun zaman aşımı sadece güvenlik payı.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Docker'daki RiftVoice servisinin host portu
    proxy_pass http://127.0.0.1:4010;
  }

  # ---- Sağlık kontrolü ----
  location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:4010;
  }

  # ---- Frontend: statik dosyalar + oda linkleri (/r/oda-adi) ----
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:4010;
  }
}
