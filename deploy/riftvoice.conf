# /etc/nginx/conf.d/riftvoice.conf
#
# RiftVoice reverse proxy (IP ile erişim: https://212.64.215.98).
#
# - default_server KULLANILMAZ: sadece Host başlığı tam olarak "212.64.215.98"
#   olan istekler bu bloğa düşer. Domain'li diğer siteler etkilenmez.
# - Frontend ve backend aynı Node sürecinden, aynı porttan sunulur
#   (docker-compose: 127.0.0.1:4010). Aynı origin olduğu için CORS gerekmez.
# - Domain alındığında: server_name'i domain ile, sertifikayı da gerçek
#   sertifikayla değiştirmen yeterli.

# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name 212.64.215.98;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name 212.64.215.98;

  # Kendinden imzalı IP sertifikası (bkz. deploy/DEPLOY.md, adım 3)
  ssl_certificate     /etc/ssl/riftvoice/ip.crt;
  ssl_certificate_key /etc/ssl/riftvoice/ip.key;

  # ---- Backend: WebSocket sinyal sunucusu ----
  location = /ws {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    # İstemci 5 sn'de bir ping atar; uzun zaman aşımı sadece güvenlik payı.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass http://127.0.0.1:4010;
  }

  # ---- Frontend: arayüz, statik dosyalar, oda linkleri (/r/oda-adi), /healthz ----
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:4010;
  }
}
