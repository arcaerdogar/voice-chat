# /etc/nginx/conf.d/riftvoice.conf
#
# Eski IP adresiyle (https://212.64.215.98/...) paylaşılmış linkler çalışmaya devam etsin diye
# yeni adrese yönlendirir. Uygulamanın asıl ayarı: voicechat.ituacm.com.conf
#
# default_server KULLANILMAZ: sadece Host başlığı tam olarak "212.64.215.98" olan istekler
# bu bloğa düşer; domain'li diğer siteler etkilenmez.

server {
  listen 80;
  listen [::]:80;
  server_name 212.64.215.98;
  return 301 https://voicechat.ituacm.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name 212.64.215.98;

  # Daha önce üretilen kendinden imzalı IP sertifikası (bkz. DEPLOY.md)
  ssl_certificate     /etc/ssl/riftvoice/ip.crt;
  ssl_certificate_key /etc/ssl/riftvoice/ip.key;

  return 301 https://voicechat.ituacm.com$request_uri;
}
