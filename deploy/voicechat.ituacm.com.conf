# /etc/nginx/conf.d/voicechat.ituacm.com.conf
#
# Yankı (sesli sohbet + müzik) — voicechat.ituacm.com
#
# Frontend ve backend AYNI Node sürecinden, aynı porttan sunulur (docker-compose: 127.0.0.1:4010).
# Aynı origin olduğu için CORS gerekmez.
#
# NOT: Diğer uygulamalardaki "statik dosyaları 1 yıl immutable önbellekle" kuralı burada
# KULLANILMAMALI: dosya adları parmak izli değil (app.js, style.css). Uzun önbellek, güncelleme
# sonrası tarayıcıların eski kodu çalıştırmasına yol açar. Uygulama doğru Cache-Control'ü kendisi gönderir.
#
# NOT: Güvenlik başlıklarını (X-Frame-Options, Referrer-Policy vb.) uygulama kendisi gönderir;
# burada add_header ile tekrar eklemeyin (çift başlık olur).

# HTTP -> HTTPS yönlendirme
server {
  listen 80;
  listen [::]:80;
  server_name voicechat.ituacm.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name voicechat.ituacm.com;

  # Cloudflare Origin sertifikası (*.ituacm.com'u kapsamalı)
  ssl_certificate     /etc/ssl/cloudflare/ituacm.com.origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare/ituacm.com.origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # ---- Sinyal sunucusu (WebSocket) ----
  location = /ws {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    # İstemci 5 sn'de bir ping atar; uzun zaman aşımı sadece güvenlik payı.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass http://127.0.0.1:4010;
  }

  # ---- Müzik ses akışı ----
  # Tamponlama kapalı: ses nginx'te beklemeden akar. Sarma (Range) başlıkları olduğu gibi geçer.
  location /music/audio/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://127.0.0.1:4010;
  }

  # ---- Arayüz, oda linkleri (/r/kanal-adi), /healthz ----
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:4010;
  }
}
