# coturn ayarları (RiftVoice için TURN sunucusu)
#
# TURN, doğrudan (P2P) bağlanamayan iki oyuncunun sesini bu sunucu üzerinden aktarır
# (mobil hat / CGNAT, yurt-şirket ağları, VPN vb.). Doğrudan bağlanabilenler bunu kullanmaz.
#
# Gizli anahtar bu dosyada DEĞİL: docker-compose, .env içindeki TURN_SECRET'ı
# komut satırından (--static-auth-secret) verir.

listening-port=3478
# Ses aktarımı için kullanılacak UDP port aralığı (firewall'da açılmalı)
min-port=49160
max-port=49260

# Sunucunun genel IP'si (aday adreslerinde bu IP ilan edilir)
external-ip=212.64.215.98

realm=riftvoice
fingerprint

# Süreli kimlik bilgisi (RiftVoice sunucusu TURN_SECRET ile üretir)
use-auth-secret

# Sadece TURN; şifreli kanal (TLS/DTLS) nginx'in portlarıyla çakışmasın diye kapalı
no-tls
no-dtls
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600

# Kötüye kullanım sınırları
total-quota=200
max-bps=64000

# GÜVENLİK: TURN üzerinden sunucunun iç ağına / localhost'taki diğer
# uygulamalara (ör. 127.0.0.1:4005) erişilmesini engelle. (Loopback coturn 4.6+ da
# zaten varsayılan olarak kapalıdır; aşağıdaki liste ek güvencedir.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
